aid: diamond
name: Diamond
description: 'Diamond (diamond.io) is an early-stage, managed serverless data backend for teams,
  positioned as "your project, but with AI." The product promises a world-class serverless database
  where teams bring their own data sources, AI-assisted setup so no schema configuration is required,
  team collaboration with role management, and single sign-on via Google, Microsoft, and LDAP. As of
  this profile the public surface is a pre-launch landing page with a "create your workspace" signup
  form and a sign-in page; no developer portal, API documentation, SDKs, pricing, changelog, or status
  page are published yet. Diamond Inc. is a portfolio company of Partech. This profile was added to the
  API Evangelist network as a lead and enriched from the provider''s public web surface.'
